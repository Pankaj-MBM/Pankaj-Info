<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG image template</title>
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: Geist, system-ui, sans-serif;
        color: #0e0e11;
        background:
          radial-gradient(700px 500px at 95% 0%, rgba(176, 141, 87, 0.22), transparent 65%),
          radial-gradient(600px 400px at 0% 100%, rgba(31, 59, 143, 0.1), transparent 65%),
          #f6f3ec;
      }
      .wrap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 70px;
        padding: 0 80px;
      }
      .photo {
        position: relative;
        flex: none;
        width: 330px;
        height: 412px;
        overflow: hidden;
        border: 8px solid #fff;
        border-radius: 34px;
        background: #fff;
        box-shadow: 0 50px 90px -40px rgba(20, 20, 40, 0.5);
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 10%;
        border-radius: 26px;
      }
      .photo::after {
        content: '';
        position: absolute;
        inset: 12px;
        border: 1.5px solid rgba(176, 141, 87, 0.6);
        border-radius: 24px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #8a6a35;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .eyebrow::before {
        content: '';
        width: 40px;
        height: 1.5px;
        background: currentColor;
      }
      h1 {
        margin: 22px 0 0;
        font-size: 80px;
        font-weight: 750;
        line-height: 0.98;
        letter-spacing: -0.05em;
      }
      h1 em {
        font-family: 'Instrument Serif', serif;
        font-weight: 400;
        letter-spacing: -0.01em;
        color: #8a6a35;
      }
      .role {
        margin-top: 22px;
        font-size: 28px;
        color: #5b5a62;
        line-height: 1.35;
      }
      .role b {
        color: #0e0e11;
        font-weight: 600;
      }
      .chips {
        display: flex;
        gap: 10px;
        margin-top: 30px;
      }
      .chip {
        padding: 9px 18px;
        border: 1px solid #e6e0d4;
        border-radius: 999px;
        background: #fff;
        font-size: 19px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="photo"><img src="../src/assets/profile/pankaj.jpg" alt="" /></div>
      <div>
        <div class="eyebrow">Software Engineer</div>
        <h1>Pankaj <em>Parihar</em></h1>
        <p class="role">I ship <b>AI-powered products</b> businesses use daily — Angular, .NET &amp; Azure OpenAI.</p>
        <div class="chips">
          <span class="chip">2+ years</span>
          <span class="chip">40+ REST APIs</span>
          <span class="chip">Live: 2026.co.in</span>
        </div>
      </div>
    </div>
  </body>
</html>
